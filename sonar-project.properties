sonar.projectKey=thothtech-documentation-website
sonar.projectName=ThothTech Documentation Website
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/.astro/**,**/coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality gate: fail the Code Quality stage on new code duplication/smells above defaults.
sonar.qualitygate.wait=true
